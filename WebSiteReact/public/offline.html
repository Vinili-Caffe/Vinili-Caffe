<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a110c" />
    <title>Sei offline · Vinili &amp; Caffè</title>
    <!-- tutto inline: offline non deve richiedere rete (niente favicon/css esterni) -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230b0705'/%3E%3Ccircle cx='32' cy='32' r='28' fill='none' stroke='%231e140e' stroke-width='2'/%3E%3Ccircle cx='32' cy='32' r='10' fill='%23c9a46e'/%3E%3Ccircle cx='32' cy='32' r='3' fill='%230e0906'/%3E%3C/svg%3E"
    />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
        background: radial-gradient(ellipse at top, #2a1c14, #0e0906 70%); color: #f4e9d8;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center;
      }
      .disc {
        width: 150px; height: 150px; margin: 0 auto 28px; border-radius: 50%; position: relative;
        background: repeating-radial-gradient(circle, #0b0705 0 1.5px, #1e140e 1.5px 3px);
        box-shadow: 0 20px 50px -20px #000, inset 0 0 0 1px rgba(196,160,122,.2);
      }
      .disc::after {
        content: "☕"; position: absolute; inset: 34%; border-radius: 50%; display: grid; place-items: center;
        background: radial-gradient(circle at 40% 35%, #f6e6c8, #c9a46e); font-size: 22px;
      }
      h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 600; font-size: 2.2rem; margin: 0; }
      p { color: rgba(244,233,216,.65); max-width: 26rem; margin: 10px auto 26px; }
      button {
        display: inline-block; padding: 12px 26px; border-radius: 999px; font-weight: 600; border: 0; cursor: pointer;
        color: #0e0906; background: linear-gradient(90deg, #d99a5b, #f0b46e); font: inherit;
      }
      button:disabled { opacity: 0.6; cursor: wait; }
    </style>
  </head>
  <body>
    <main>
      <div class="disc" aria-hidden="true"></div>
      <h1>Il disco si è fermato</h1>
      <p>Sei senza connessione. Appena torna la rete, rimettiamo su il vinile e ti riportiamo dov'eri.</p>
      <button type="button" id="retry">Riprova</button>
    </main>
    <script>
      (function () {
        var btn = document.getElementById("retry");
        if (!btn) return;
        btn.addEventListener("click", function () {
          btn.disabled = true;
          btn.textContent = "Controllo…";
          // ricarica l'URL corrente (es. /dati/), non la home
          location.reload();
        });
        window.addEventListener("online", function () {
          location.reload();
        });
      })();
    </script>
  </body>
</html>
