# Plugin JAR: blocco `lavalink.plugins` (sibling di `lavalink.server`), vedi Lavalink/README.md.
# Se PM2 avvia `java -jar` con cwd fuori da questa cartella, usa `start-lavalink.sh` (passa spring.config.additional-location).
server:
  port: 2333
  address: 127.0.0.1

logging:
  level:
    root: WARN
    lavalink: WARN
    # YouTube clients (TVHTML5 / WEBEMBEDDED) falliscono spesso e ritentano:
    # AllClientsFailedException + dump formati itag inquinano PM2 senza essere crash.
    # WARN temporaneo: vedere quale client fallisce (SABR / login / 403)
    dev.lavalink.youtube: WARN
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO
    com.sedmelluq.discord.lavaplayer: ERROR
    com.sedmelluq.discord.lavaplayer.track.playback: ERROR
  request:
    enabled: false

plugins:
  lavasrc:
    # ytmsearch prima: ytsearch spesso empty. ISRC senza virgolette (match più stabile).
    providers:
      - "ytmsearch:\"%ISRC%\""
      - "ytmsearch:\"%QUERY%\""
      - "ytsearch:\"%ISRC%\""
      - "ytsearch:%QUERY%"
      - "scsearch:%QUERY%"
    sources:
      spotify: true
    spotify:
      clientId: "5e7d3614e8d94e008e0917f2e230d89b"
      clientSecret: "4e0ce68e108d423592624a13cd17efeb"
      countryCode: "IT"
      playlistLoadLimit: 6
      albumLoadLimit: 6
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # YouTube cambia spesso lo script signature: senza remote cipher → loadfailed a stream.
    # In prod: docker `yt-cipher` su 127.0.0.1:8001 (ghcr.io/kikkia/yt-cipher:master).
    # Fallback pubblico: https://cipher.kikkia.dev/
    remoteCipher:
      url: "http://127.0.0.1:8001"
      userAgent: "vinili-caffe-bots"
    # Video age-restricted / explicit spesso: "This video requires login" → OAuth obbligatorio.
    # Al primo boot Lavalink stampa un link + codice; dopo salva refreshToken sotto.
    oauth:
      enabled: true
      # Persistito dopo device-login (non rifare OAuth a ogni restart).
      refreshToken: "1//098cQCzO4Ej4sCgYIARAAGAkSNwF-L9IrzaWojR_YL51oRTGLnMyNFZyu646jsr721EMlzKIZjuqXWw7obdRTehacEwP0tORhFRk"
    clients:
      # TV+OAuth = playback (metadata None → saltato su loadtracks URL).
      # TVHTML5_SIMPLY = metadata+playback video (no OAuth) → loadtracks diretti.
      # WEBEMBEDDED / ANDROID_VR = fallback metadata; MUSIC solo search (playback false).
      # WEB/MWEB = SABR senza URL → loadfailed (playback false).
      - TV
      - TVHTML5_SIMPLY
      - WEBEMBEDDED
      - ANDROID_VR
      - MUSIC
    clientOptions:
      MUSIC:
        playback: false
      WEB:
        playback: false
      MWEB:
        playback: false

lavalink:
  server:
    password: "youshallnotpass"
    bufferDurationMs: 1000
    frameBufferDurationMs: 1500
    trackStuckThresholdMs: 15000
    playerUpdateInterval: 5
    timeouts:
      # cipher remoto + innertube: 10s troppo stretti su datacenter IP
      connectTimeoutMs: 15000
      connectionRequestTimeoutMs: 15000
      socketTimeoutMs: 20000
    sources:
      youtube: false
      # Fallback: yt-dlp risolve URL diretti → Lavaplayer http source
      http: true
      soundcloud: true
  plugins:
    # 1.18.2: fix itag=18 + ResponseStatusException (ex snapshot post-1.18.1).
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      repository: "https://maven.lavalink.dev/releases"
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"
