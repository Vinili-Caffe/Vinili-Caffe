# Nginx: /personalizza canonico; legacy /user/personalizza → redirect lato HTML/JS.
# Non reindirizzare /personalizza verso /user/personalizza.
location = /user/personalizza { return 301 /personalizza/; }
location = /user/personalizza/ { return 301 /personalizza/; }
location = /user/customize { return 301 /personalizza/?target=rank; }
location = /user/customize/ { return 301 /personalizza/?target=rank; }
location = /user/custom { return 301 /personalizza/?target=primary; }
location = /user/custom/ { return 301 /personalizza/?target=primary; }
