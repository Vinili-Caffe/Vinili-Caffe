# langPrefix2: /en/... → stesso contenuto di /... + cookie lingua
# Il browser tiene il prefisso; nginx fa rewrite interno.

# /en → /en/
location ~ "^/(it|en|es|fr|de|pt|ru|zh|ja|ko|ar|nl|pl|tr|hi|id|uk|vi|ro|sv)$" {
    return 301 /$1/;
}

# /en/foo → serve /foo (URI browser resta /en/foo)
location ~ "^/(it|en|es|fr|de|pt|ru|zh|ja|ko|ar|nl|pl|tr|hi|id|uk|vi|ro|sv)/(.*)$" {
    set $vc_lang_cookie $1;
    add_header Set-Cookie "vc_site_lang=$vc_lang_cookie; Path=/; Max-Age=31536000; SameSite=Lax; Secure" always;
    rewrite "^/(?:it|en|es|fr|de|pt|ru|zh|ja|ko|ar|nl|pl|tr|hi|id|uk|vi|ro|sv)/(.*)$" /$1 last;
}
