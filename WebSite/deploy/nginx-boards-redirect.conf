# Legacy EN /boards → canonico /bacheca (vc-bacheca-redirect1 / boardsPrettyPath1).
location = /boards { return 301 /bacheca/; }
location = /boards/ { return 301 /bacheca/; }
location = /boards/servers { return 301 /bacheca/server/; }
location = /boards/servers/ { return 301 /bacheca/server/; }
location = /boards/bots { return 301 /bacheca/bot/; }
location = /boards/bots/ { return 301 /bacheca/bot/; }
location = /boards/submit { return 301 /bacheca/invia/; }
location = /boards/submit/ { return 301 /bacheca/invia/; }
location = /boards/manage { return 301 /bacheca/le-mie/; }
location = /boards/manage/ { return 301 /bacheca/le-mie/; }
location = /boards/mod { return 301 /bacheca/mod/; }
location = /boards/mod/ { return 301 /bacheca/mod/; }
location = /boards/view { return 301 /bacheca/scheda/; }
location = /boards/view/ { return 301 /bacheca/scheda/; }
location ^~ /boards/ { return 301 /bacheca/; }

# boardsPrettyPath1: hub bots plural → hub singular
location = /bacheca/bots { return 301 /bacheca/bot/; }
location = /bacheca/bots/ { return 301 /bacheca/bot/; }

# boardsPrettyPath1 + boardsSchedaIdFix1: detail shells (id/slug) → scheda index
# /servers/ plurale → stesso shell (alias)
location = /bacheca/servers { return 301 /bacheca/server/; }
location = /bacheca/servers/ { return 301 /bacheca/server/; }
location ~ "^/bacheca/servers/([A-Za-z0-9_-]{2,80})/?$" {
    try_files /bacheca/scheda/index.html =404;
}
location ~ "^/bacheca/server/([A-Za-z0-9_-]{2,80})/?$" {
    try_files /bacheca/scheda/index.html =404;
}
location ~ "^/bacheca/bots/([A-Za-z0-9_-]{2,80})/?$" {
    try_files /bacheca/scheda/index.html =404;
}
