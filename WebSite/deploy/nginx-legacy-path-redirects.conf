# Legacy path aliases → canonical pages (vc-legacyPathRedirects1).
# Include nel server block; exact (=) batte ^~ /staff/ e try_files.

# roles → ruoli
location = /roles { return 301 /ruoli/; }
location = /roles/ { return 301 /ruoli/; }
location ^~ /roles/ { return 301 /ruoli/; }

# stato → status
location = /stato { return 301 /status/; }
location = /stato/ { return 301 /status/; }
location ^~ /stato/ { return 301 /status/; }

# suggerimenti → feedback
location = /suggerimenti { return 301 /feedback/; }
location = /suggerimenti/ { return 301 /feedback/$is_args$args; }
location ^~ /suggerimenti/ { return 301 /feedback/; }

# supporto → tickets
location = /supporto { return 301 /tickets/; }
location = /supporto/ { return 301 /tickets/; }
location ^~ /supporto/ { return 301 /tickets/; }

# notifiche / messaggi / inbox → notifications
location = /notifiche { return 301 /notifications/; }
location = /notifiche/ { return 301 /notifications/; }
location = /messaggi { return 301 /notifications/; }
location = /messaggi/ { return 301 /notifications/; }
location = /inbox { return 301 /notifications/?view=staff; }
location = /inbox/ { return 301 /notifications/?view=staff; }

# profilo / account → user
location = /profilo { return 301 /user/; }
location = /profilo/ { return 301 /user/; }
location = /account { return 301 /user/; }
location = /account/ { return 301 /user/; }

# premium → perks
location = /premium { return 301 /perks/; }
location = /premium/ { return 301 /perks/; }

# unban / unmute → appelli
location = /unban { return 301 /appelli/; }
location = /unban/ { return 301 /appelli/; }
location = /unban/accesso-richiesto { return 301 /appelli/accesso-richiesto/; }
location = /unban/accesso-richiesto/ { return 301 /appelli/accesso-richiesto/; }
location ^~ /unban/ { return 301 /appelli/; }
location = /unmute { return 301 /appelli/?tipo=unmute; }
location = /unmute/ { return 301 /appelli/?tipo=unmute; }
location = /unmute/accesso-richiesto { return 301 /appelli/accesso-richiesto/?from=%2Fappelli%2F%3Ftipo%3Dunmute; }
location = /unmute/accesso-richiesto/ { return 301 /appelli/accesso-richiesto/?from=%2Fappelli%2F%3Ftipo%3Dunmute; }
location ^~ /unmute/ { return 301 /appelli/?tipo=unmute; }

# staff root → profilo tab staff (exact = only — organico/guida/compiti/pause/gestione intact)
location = /staff { return 301 /user/?tab=staff; }
location = /staff/ { return 301 /user/?tab=staff; }

# staff legacy shortcuts
location = /staff/ticket { return 301 /tickets/; }
location = /staff/ticket/ { return 301 /tickets/; }
location = /staff/tickets { return 301 /tickets/; }
location = /staff/tickets/ { return 301 /tickets/; }
location = /staff/inbox { return 301 /notifications/?view=staff; }
location = /staff/inbox/ { return 301 /notifications/?view=staff; }
location = /staff/punti-tolti { return 301 /user/; }
location = /staff/punti-tolti/ { return 301 /user/; }
location = /staff/confessionale { return 301 /confessionale/?board=staff; }
location = /staff/confessionale/ { return 301 /confessionale/?board=staff; }

# dashboard suggerimenti → feedback
location = /dashboard/suggerimenti { return 301 /dashboard/feedback/; }
location = /dashboard/suggerimenti/ { return 301 /dashboard/feedback/; }
location ^~ /dashboard/suggerimenti/ { return 301 /dashboard/feedback/; }
