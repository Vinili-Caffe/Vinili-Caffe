<!DOCTYPE html>
<html lang="it">
  <head>
{{COOKIEYES_BLOCK}}{{GA_BLOCK}}
    <meta charset="utf-8" />
    <title>Verifica account - {{SITE_NAME}}</title>
    <meta name="description" content="Completa la verifica account con login Discord e conferma backend." />
    <meta name="author" content="{{SITE_NAME}}" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{OG_SITE_NAME}}" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:title" content="{{VERIFY_OG_TITLE}}" />
    <meta property="og:description" content="{{VERIFY_OG_DESCRIPTION}}" />
    <meta property="og:url" content="{{VERIFY_OG_URL}}" />
    <meta property="og:image" content="{{OG_IMAGE_URL}}" />
    <meta property="og:image:width" content="{{OG_IMAGE_WIDTH}}" />
    <meta property="og:image:height" content="{{OG_IMAGE_HEIGHT}}" />
    <meta property="og:image:alt" content="{{OG_IMAGE_ALT}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../css/tw-build.css" />
    <script>
      window.__VC_REQUIRE_BLOCKING_SESSION_VERIFY = true;
    </script>
    <link rel="stylesheet" href="../css/vc-landing.css" />
    <script src="../js/vc-auth-pending.js"></script>
    <link rel="icon" href="{{GUILD_ICON_URL}}" />
  </head>
  <body class="vc-body relative min-h-screen overflow-x-hidden font-sans text-slate-100 antialiased">
    <div class="vc-blob vc-blob-a" aria-hidden="true"></div>
    <div class="vc-blob vc-blob-b" aria-hidden="true"></div>
    <div class="vc-blob vc-blob-c" aria-hidden="true"></div>

    <main class="relative z-10 mx-auto flex min-h-screen w-full max-w-2xl flex-col items-center justify-center px-4 py-10">
      <section id="vc-verify-phase-pre" class="w-full rounded-3xl border border-white/10 bg-black/30 p-6 sm:p-7">
        <div class="mb-4 inline-flex h-12 w-12 items-center justify-center rounded-full border border-emerald-300/30 bg-emerald-300/10 text-emerald-200">
          <i class="fa fa-shield" aria-hidden="true"></i>
        </div>
        <h1 class="text-3xl font-extrabold tracking-tight text-white sm:text-4xl">Verifica account</h1>
        <p class="mt-2 text-sm text-slate-300">Accedi con Discord per completare la verifica lato backend e sbloccare l'accesso.</p>
        <div id="vc-verify-status" class="mt-5 rounded-xl border border-white/10 bg-black/20 p-4 text-sm text-slate-200">
          Verifica sessione in corso...
        </div>
        <div class="mt-4 flex flex-wrap gap-2">
          <button id="vc-verify-login-btn" type="button" class="inline-flex items-center gap-2 rounded-xl border border-emerald-300/40 bg-emerald-300/15 px-4 py-2.5 text-sm font-semibold text-emerald-100 hover:border-emerald-300/70" hidden>
            <i class="fa fa-sign-in" aria-hidden="true"></i> Accedi con Discord
          </button>
          <a href="{{SITE_URL}}" class="inline-flex items-center gap-2 rounded-xl border border-white/20 bg-white/5 px-4 py-2.5 text-sm font-semibold text-slate-100 hover:border-white/40">
            <i class="fa fa-home" aria-hidden="true"></i> Torna alla Home
          </a>
        </div>
      </section>
      <section id="vc-verify-phase-done" class="hidden w-full flex-col items-center justify-center rounded-3xl border border-emerald-400/25 bg-gradient-to-b from-emerald-950/40 to-black/40 px-6 py-12 text-center sm:px-10 sm:py-14" aria-live="polite">
        <p class="text-6xl leading-none sm:text-7xl" aria-hidden="true">🎉</p>
        <h1 class="mt-6 text-3xl font-extrabold tracking-tight text-white sm:text-5xl">Ti sei verificato!</h1>
        <p id="vc-verify-done-sub" class="mt-4 max-w-md text-base text-slate-200/95"></p>
        <p id="vc-verify-countdown" class="mt-3 text-sm text-slate-400"></p>
        <div class="mt-8 flex flex-col items-center gap-3 sm:flex-row sm:justify-center">
          <a id="vc-verify-discord-btn" class="inline-flex min-h-[3rem] items-center justify-center gap-2 rounded-2xl border border-[#5865F2]/50 bg-[#5865F2]/20 px-6 py-3 text-sm font-bold text-white shadow-lg transition hover:border-[#5865F2]/80 hover:bg-[#5865F2]/35" href="{{DISCORD_INVITE_URL}}" target="_blank" rel="noopener noreferrer">Vai su Discord ora</a>
          <a href="{{SITE_URL}}" class="inline-flex min-h-[3rem] items-center justify-center gap-2 rounded-2xl border border-white/15 bg-white/5 px-6 py-3 text-sm font-semibold text-slate-100 hover:border-white/35">Home</a>
        </div>
      </section>
    </main>

    <script>
      window.__VC_AUTH = {
        clientId: "{{DISCORD_OAUTH_CLIENT_ID}}",
        redirectUri: "{{DISCORD_OAUTH_REDIRECT_URI}}",
        homeUrl: "{{SITE_URL}}",
      };
      window.__VC_SITE_VERIFY = {
        apiUrl: "{{SITE_URL}}/webhooks/site-verify/complete",
        apiUrlLocal: "http://127.0.0.1:3042/webhooks/site-verify/complete",
      };
      window.__VC_VERIFY = {
        inviteUrl: "{{DISCORD_INVITE_URL}}",
        redirectDelayMs: 3400,
      };
    </script>
    <script src="../js/discord-auth.js" defer></script>
    <script src="../js/vc-landing.js" defer></script>
    <script src="../js/verify-page.js" defer></script>
  </body>
</html>
