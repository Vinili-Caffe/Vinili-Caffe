<style id="vc-fa-noflash-css">html:not(.vc-fa-ready) .fa{visibility:hidden!important;opacity:0!important}html:not(.vc-fa-ready) .fa:before{content:""!important}html.vc-fa-ready .fa{visibility:visible!important;opacity:1!important}</style>
<script id="vc-auth-instant-boot">(function(){try{var t=localStorage.getItem("vc_discord_access_token");if(!t)return;var e=Number(localStorage.getItem("vc_discord_expires_at")||"0");if(e&&Date.now()>=e)return;if((location.hash||"").indexOf("access_token=")!==-1)return;document.documentElement.classList.add("vc-auth-session-pending")}catch(x){}})();</script>
<style id="vc-auth-session-instant-css">html.vc-auth-session-pending #discord-login-btn,html.vc-auth-session-pending button[data-vc-discord-login]{visibility:hidden!important;pointer-events:none!important}html.vc-auth-session-pending #discord-login-state,html.vc-auth-session-pending .header-login-state{display:flex!important;visibility:visible!important}html.vc-auth-session-pending #discord-login-state[hidden],html.vc-auth-session-pending .header-login-state[hidden]{display:flex!important;visibility:visible!important}#header-quick-actions{min-width:2.75rem;min-height:2.375rem}</style>

  <body class="vc-body vc-candidature-page relative min-h-screen overflow-x-hidden font-sans text-slate-100 antialiased">
    <div class="vc-blob vc-blob-a" aria-hidden="true"></div>
    <div class="vc-blob vc-blob-b" aria-hidden="true"></div>
    <header class="fixed inset-x-0 top-0 z-50 px-4 pt-4">
      <div class="vc-nav-shell rounded-2xl mx-auto flex items-center justify-between gap-3 border border-white/[0.08] bg-[#140f0c] px-4 py-3 sm:px-5">
        <div class="flex min-w-0 items-center gap-2.5">
          <a class="vc-header-logo-link shrink-0 rounded-2xl ring-1 ring-[#d4a888]/35" href="{{DISCORD_INVITE_URL}}" target="_blank" rel="noopener noreferrer" aria-label="Entra su Discord"><img src="{{GUILD_ICON_URL}}" width="40" height="40" class="vc-header-logo-img" alt="" /></a>
          <a class="min-w-0 truncate text-[0.7rem] font-bold uppercase tracking-[0.18em] text-white sm:text-xs" href="{{SITE_URL}}">{{SITE_NAME}}</a>
        </div>
        <div class="flex items-center gap-2" id="header-quick-actions">
          <button class="vc-header-pill" type="button" data-vc-discord-login>Login</button>
          <div class="header-login-state" id="discord-login-state" hidden></div>
        </div>
      </div>
    </header>
    <main class="relative z-10 mx-auto flex min-h-screen max-w-2xl items-center justify-center px-4 pb-10 pt-28 sm:pt-32">
      <section class="vc-auth-required-card w-full max-w-md rounded-3xl border border-white/10 p-6 sm:p-7" aria-labelledby="auth-required-title">
        <div class="vc-auth-required-icon mb-6" aria-hidden="true"><i class="fa fa-shield"></i></div>
        <h1 id="auth-required-title" class="text-center text-4xl font-extrabold leading-[1.05] tracking-tight text-white">Accesso<br />Richiesto</h1>
        <p class="mt-3 text-center text-sm text-slate-300">Accedi per continuare nell'area staff</p>
        <div class="mt-6 rounded-xl border border-[#d4a888]/22 bg-[#1a120d]/72 p-3 text-sm text-slate-100">
          <p class="m-0 flex items-center gap-2"><i class="fa fa-lock text-[#d4a888]" aria-hidden="true"></i> <span>Sezione riservata al team staff</span></p>
        </div>
        <button type="button" id="vc-mobile-nav-toggle" class="vc-mobile-nav-toggle vc-icon-btn" aria-label="Apri menu di navigazione" aria-controls="vc-mobile-nav-drawer" aria-expanded="false"><span class="vc-mobile-nav-toggle-bars" aria-hidden="true"><span></span><span></span><span></span></span></button>
        <button id="discord-login-btn" type="button" data-vc-discord-login class="vc-auth-required-login mt-5 inline-flex w-full items-center justify-center gap-2 rounded-xl px-4 py-3 text-base font-bold text-white">
          <i class="fa fa-sign-in" aria-hidden="true"></i> <span>Accedi con Discord</span>
        </button>
        <a class="vc-auth-required-secondary mt-4 inline-flex w-full items-center justify-center gap-2 rounded-xl px-4 py-3 text-sm font-semibold text-slate-100" href="{{SITE_URL}}">
          <i class="fa fa-chevron-left" aria-hidden="true"></i> <span>Torna alla Home</span>
        </a>
      </section>
    </main>
    <script>
      window.__VC_AUTH = {
        clientId: "{{DISCORD_OAUTH_CLIENT_ID}}",
        redirectUri: "{{DISCORD_OAUTH_REDIRECT_URI}}",
        homeUrl: "{{SITE_URL}}",
      };
