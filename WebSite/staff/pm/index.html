<!DOCTYPE html>
<html lang="it">
  <head>
{{COOKIEYES_BLOCK}}{{GA_BLOCK}}
    <meta charset="utf-8" />
    <title>{{SITE_NAME}} | Partner Manager</title>
    <meta name="description" content="Punti, classifica e blacklist partnership." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{SITE_NAME}} | Partner Manager" />
    <meta property="og:url" content="{{SITE_URL}}staff/pm/" />
    <meta property="og:image" content="{{OG_IMAGE_URL}}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../../css/tw-build.css" />
    <link rel="stylesheet" href="../../css/vc-landing.css" />
    <link rel="stylesheet" href="../../css/staff-pause.css" />
    <link rel="icon" href="{{GUILD_ICON_URL}}" />
    <script>
      (function () {
        try {
          if (String(location.hash || "").indexOf("access_token=") !== -1) return;
          var t = localStorage.getItem("vc_discord_access_token");
          var exp = Number(localStorage.getItem("vc_discord_expires_at") || "0");
          if (t && (!exp || Date.now() < exp)) return;
          var u = new URL("/staff/accesso-richiesto/", location.origin);
          u.searchParams.set("from", "/staff/pm/");
          location.replace(u.href);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="vc-body relative min-h-screen overflow-x-hidden font-sans text-slate-100 antialiased">
    <div class="vc-blob vc-blob-a" aria-hidden="true"></div>
    <div class="vc-blob vc-blob-b" aria-hidden="true"></div>
    <div id="vc-staff-loading" class="vc-staff-loading" role="status" aria-live="polite">
      <div class="vc-staff-loading__card">
        <p class="vc-staff-loading__text">Verifica accesso staff…</p>
        <p class="vc-staff-loading__hint">Controllo ruoli Discord in corso</p>
      </div>
    </div>
    <div id="vc-staff-denied" class="vc-staff-denied" hidden role="alert">
      <div class="vc-staff-denied__card">
        <h2 class="vc-staff-denied__title">Accesso non consentito</h2>
        <p id="vc-staff-denied-msg" class="vc-staff-denied__msg"></p>
        <div class="vc-staff-denied__actions">
          <button type="button" id="vc-staff-denied-retry" class="vc-staff-denied__btn vc-staff-denied__btn--secondary">Cambia account Discord</button>
          <a class="vc-staff-denied__btn vc-staff-denied__btn--primary" href="{{DISCORD_INVITE_URL}}" target="_blank" rel="noopener noreferrer">Entra nel server</a>
          <a class="vc-staff-denied__btn vc-staff-denied__btn--ghost" href="{{SITE_URL}}">Torna alla home</a>
        </div>
      </div>
    </div>

    <div class="vc-staff-app">
      <header class="fixed inset-x-0 top-0 z-50 px-4 pt-3">
        <div class="vc-nav-shell vc-glass vc-staff-nav-wide mx-auto flex items-center justify-between gap-3 rounded-2xl border border-white/[0.08] bg-[#140f0c]/78 px-4 py-2.5 shadow-[0_8px_40px_rgba(0,0,0,0.48)] sm:px-5">
          <div class="flex min-w-0 items-center gap-2.5">
            <a class="vc-header-logo-link shrink-0 rounded-2xl ring-1 ring-[#d4a888]/35" href="{{DISCORD_INVITE_URL}}" target="_blank" rel="noopener noreferrer" aria-label="Entra su Discord"><img src="{{GUILD_ICON_URL}}" width="36" height="36" class="vc-header-logo-img" alt="" /></a>
            <a class="min-w-0 truncate text-[0.7rem] font-bold uppercase tracking-[0.18em] text-white sm:text-xs" href="/staff/">Staff</a>
          </div>
          <div class="flex items-center gap-2" id="header-quick-actions">
            <button class="vc-header-pill" id="discord-login-btn" type="button"><span>Login</span></button>
            <div class="header-login-state" id="discord-login-state" hidden></div>
          </div>
        </div>
      </header>

      <main class="vc-staff-shell vc-staff-shell--wide">
        <section class="vc-staff-hero vc-staff-hero--page vc-staff-hero--compact">
          <p class="vc-staff-hero__kicker"><a class="vc-staff-hero__crumb" href="/staff/">Staff</a> · PM</p>
          <h1 class="vc-staff-hero__title">Hub Partner Manager</h1>
          <p class="vc-staff-hero__lead">I tuoi punti, la classifica e la blacklist (sola lettura).</p>
        </section>

        <p id="vc-staff-pm-status" class="vc-staff-profile-status" role="status" aria-live="polite">Caricamento…</p>
        <article id="vc-staff-pm" class="vc-staff-tools" hidden></article>
      </main>
    </div>

    <script>
      window.__VC_AUTH = {
        clientId: "{{DISCORD_OAUTH_CLIENT_ID}}",
        redirectUri: "{{DISCORD_OAUTH_REDIRECT_URI}}",
        homeUrl: "{{SITE_URL}}",
      };
      window.__VC_STAFF_ACCESS = {
        apiUrl: "{{STAFF_ACCESS_API_URL}}",
        apiUrlLocal: "{{STAFF_ACCESS_API_URL_LOCAL}}",
      };
      window.__VC_STAFF_PM_HUB = {
        apiUrl: "{{STAFF_PM_HUB_API_URL}}",
        apiUrlLocal: "{{STAFF_PM_HUB_API_URL_LOCAL}}",
      };
    </script>
    <script src="../../js/discord-auth.js" defer></script>
    <script src="../../js/vc-landing.js" defer></script>
    <script src="../../js/staff-access-gate.js" defer></script>
    <script src="../../js/staff-tools-common.js" defer></script>
    <script src="../../js/staff-pm-page.js" defer></script>
      <script src="/js/vc-cursor-trail.js?v={{BUILD_ASSET_VERSION}}" defer></script>
  </body>
</html>
