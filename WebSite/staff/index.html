<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>Profilo staff</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (function () {
        function staffProfileUrl(id) {
          var uid = String(id || "").trim();
          return uid
            ? "/user/?id=" + encodeURIComponent(uid) + "&tab=staff"
            : "/user/?tab=staff";
        }
        function redirect(id) {
          try {
            window.location.replace(staffProfileUrl(id));
          } catch (e) {
            window.location.href = staffProfileUrl(id);
          }
        }
        function tryFromProfile() {
          try {
            var p = window.__VC_DISCORD_PROFILE;
            if (p && /^\d{17,20}$/.test(String(p.id || ""))) {
              redirect(p.id);
              return true;
            }
          } catch (e) {}
          return false;
        }
        if (tryFromProfile()) return;
        window.addEventListener(
          "vc-discord-profile",
          function (ev) {
            var u = ev && ev.detail && ev.detail.user;
            if (u && /^\d{17,20}$/.test(String(u.id || ""))) redirect(u.id);
          },
          { once: true },
        );
        window.setTimeout(function () {
          if (!tryFromProfile()) {
            redirect("");
          }
        }, 3200);
      })();
    </script>
    <script src="../js/discord-auth.js?v=20260827staffProfMerge1" defer></script>
  </head>
  <body></body>
</html>
