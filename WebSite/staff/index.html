      (function () {
        function staffProfileUrl(id) {
          var uid = String(id || "").trim();
          return uid
            ? "/user/?id=" + encodeURIComponent(uid) + "&tab=staff"
            : "/user/?tab=staff";
        }
        function redirect(id) {
          try {
            window.location.replace(staffProfileUrl(id));
          } catch (e) {
            window.location.href = staffProfileUrl(id);
          }
        }
        function tryFromProfile() {
          try {
            var p = window.__VC_DISCORD_PROFILE;
            if (p && /^\d{17,20}$/.test(String(p.id || ""))) {
              redirect(p.id);
              return true;
            }
          } catch (e) {}
          return false;
        }
        if (tryFromProfile()) return;
        window.addEventListener(
          "vc-discord-profile",
          function (ev) {
            var u = ev && ev.detail && ev.detail.user;
            if (u && /^\d{17,20}$/.test(String(u.id || ""))) redirect(u.id);
          },
          { once: true },
        );
        /* safariUnlock3 / staffBlankFix1: logged-out non resta 3.2s su pagina bianca */
        var loggedOut = false;
        try {
          loggedOut = document.documentElement.classList.contains("vc-auth-logged-out");
        } catch (eLo) {}
        window.setTimeout(
          function () {
            if (!tryFromProfile()) {
              redirect("");
            }
          },
          loggedOut ? 180 : 3200,
        );
      })();
