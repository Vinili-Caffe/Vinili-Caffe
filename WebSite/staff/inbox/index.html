<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="0;url=/notifications/?view=staff" />
    <link rel="canonical" href="/notifications/?view=staff" />
    <title>Inbox Staff → Notifiche</title>
    <script>
      (function () {
        try {
          var dest = "/notifications/?view=staff";
          var hash = String(location.hash || "");
          location.replace(dest + hash);
        } catch (e) {
          location.href = "/notifications/?view=staff";
        }
      })();
    </script>
  </head>
  <body>
    <p>
      L'inbox staff è ora in
      <a href="/notifications/?view=staff">Notifiche → Staff</a>.
    </p>
  </body>
</html>
