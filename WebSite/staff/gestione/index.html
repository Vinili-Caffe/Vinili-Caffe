<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gestione staff — reindirizzamento</title>
    <script>
      (function () {
        var q = new URLSearchParams(location.search || "");
        var uid = String(q.get("userId") || "").trim();
        if (/^\d{17,20}$/.test(uid)) {
          location.replace(
            "/user/?id=" + encodeURIComponent(uid) + "&tab=staff&manage=1",
          );
          return;
        }
        location.replace("/staff/organico/");
      })();
    </script>
  </head>
  <body></body>
</html>
