<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>Redirect…</title>
    <meta http-equiv="refresh" content="0;url=/appelli/" />
    <link rel="canonical" href="/appelli/" />
    <script>
      (function () {
        try {
          var u = new URL("/appelli/", location.origin);
          var q = new URLSearchParams(location.search || "");
          q.forEach(function (v, k) {
            u.searchParams.set(k, v);
          });
          location.replace(u.pathname + u.search);
        } catch (e) {
          location.replace("/appelli/");
        }
      })();
    </script>
  </head>
  <body>
    <p><a href="/appelli/">Vai agli appelli</a></p>
  </body>
</html>
