<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>Vinili &amp; Caffè | Redirect</title>
    <link rel="canonical" href="/appelli/accesso-richiesto/" />
    <script>
      (function () {
        try {
          var u = new URL("/appelli/accesso-richiesto/", location.origin);
          var from = new URLSearchParams(location.search || "").get("from") || "";
          if (from) {
            from = String(from).replace(/^\/unban(\/|$)/i, "/appelli$1");
            u.searchParams.set("from", from);
          }
          location.replace(u.pathname + u.search);
        } catch (e) {
          location.replace("/appelli/accesso-richiesto/");
        }
      })();
    </script>
  </head>
  <body>
    <p><a href="/appelli/accesso-richiesto/">Accesso richiesto</a></p>
  </body>
</html>
