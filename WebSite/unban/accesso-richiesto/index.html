<!DOCTYPE html>
<html lang="it">
  <head>
{{COOKIEYES_BLOCK}}{{GA_BLOCK}}
    <meta charset="utf-8" />
    <title>Accesso richiesto - {{SITE_NAME}}</title>
    <meta name="description" content="Accedi con Discord per inviare la richiesta unban." />
    <meta name="author" content="{{SITE_NAME}}" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Accesso richiesto - {{SITE_NAME}}" />
    <meta property="og:description" content="Accedi con Discord per inviare la richiesta unban." />
    <meta property="og:url" content="{{SITE_URL}}unban/accesso-richiesto/" />
    <meta property="og:image" content="{{OG_IMAGE_URL}}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "system-ui", "sans-serif"] },
          },
        },
      };
    </script>
    <script>
      window.__VC_REQUIRE_BLOCKING_SESSION_VERIFY = true;
    </script>
    <link rel="stylesheet" href="../../css/vc-landing.css" />
    <script src="../../js/vc-auth-pending.js"></script>
    <link rel="icon" href="{{GUILD_ICON_URL}}" />
  </head>
  <body class="vc-body vc-candidature-page relative min-h-screen overflow-x-hidden font-sans text-slate-100 antialiased">
    <div class="vc-blob vc-blob-a" aria-hidden="true"></div>
    <div class="vc-blob vc-blob-b" aria-hidden="true"></div>
    <div class="vc-blob vc-blob-c" aria-hidden="true"></div>
    <main class="relative z-10 mx-auto flex min-h-screen max-w-2xl items-center justify-center px-4 py-10">
      <section class="vc-auth-required-card w-full max-w-md rounded-3xl border border-white/10 p-6 sm:p-7" aria-labelledby="auth-required-title">
        <div class="vc-auth-required-icon mb-6" aria-hidden="true">
          <i class="fa fa-shield"></i>
        </div>
        <h1 id="auth-required-title" class="text-center text-4xl font-extrabold leading-[1.05] tracking-tight text-white">
          Accesso<br />Richiesto
        </h1>
        <p class="mt-3 text-center text-sm text-slate-300">Accedi con Discord per continuare</p>
        <div class="mt-6 rounded-xl border border-rose-300/15 bg-rose-900/20 p-3 text-sm text-rose-100/90">
          <p class="m-0 flex items-center gap-2"><i class="fa fa-lock" aria-hidden="true"></i> Devi effettuare il login con Discord</p>
        </div>
        <button id="discord-login-btn" type="button" class="vc-auth-required-login mt-5 inline-flex w-full items-center justify-center gap-2 rounded-xl px-4 py-3 text-base font-bold text-white">
          <i class="fa fa-discord-alt" aria-hidden="true"></i> Accedi con Discord
        </button>
        <div id="discord-login-state" class="hidden" hidden aria-hidden="true"></div>
        <a class="vc-auth-required-secondary mt-4 inline-flex w-full items-center justify-center gap-2 rounded-xl px-4 py-3 text-sm font-semibold text-slate-100" href="{{SITE_URL}}">
          <i class="fa fa-long-arrow-left" aria-hidden="true"></i> Torna alla Home
        </a>
      </section>
    </main>
    <script>
      window.__VC_AUTH = {
        clientId: "{{DISCORD_OAUTH_CLIENT_ID}}",
        redirectUri: "{{DISCORD_OAUTH_REDIRECT_URI}}",
        homeUrl: "{{SITE_URL}}",
      };
    </script>
    <script src="../../js/discord-auth.js" defer></script>
    <script src="../../js/vc-landing.js" defer></script>
  </body>
</html>
