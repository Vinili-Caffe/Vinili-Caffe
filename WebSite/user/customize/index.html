    <script>
      (function () {
        try {
          var q = new URLSearchParams(window.location.search || "");
          var next = new URLSearchParams();
          var id = String(q.get("id") || q.get("userId") || "").trim();
          if (/^\d{17,20}$/.test(id)) next.set("id", id);
          next.set("target", "rank");
          window.location.replace("/personalizza/?" + next.toString());
        } catch (e) {
          window.location.replace("/personalizza/?target=rank");
        }
      })();
    </script>
