<!DOCTYPE html>
<html class="vc-site-polish" lang="it">
  <head>
    <script>
      (function () {
        try {
          var q = new URLSearchParams(window.location.search || "");
          var next = new URLSearchParams();
          var id = String(q.get("id") || q.get("userId") || "").trim();
          if (/^\d{17,20}$/.test(id)) next.set("id", id);
          next.set("target", "rank");
          window.location.replace("/user/personalizza/?" + next.toString());
        } catch (e) {
          window.location.replace("/user/personalizza/?target=rank");
        }
      })();
    </script>
    <meta charset="utf-8" />
    <title>{{SITE_NAME}} | Personalizza</title>
    <meta http-equiv="refresh" content="0;url=/user/personalizza/?target=rank" />
    <link rel="canonical" href="/user/personalizza/?target=rank" />
  </head>
  <body>
    <p><a href="/user/personalizza/?target=rank">Vai a Personalizza</a></p>
  </body>
</html>
