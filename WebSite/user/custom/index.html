<!DOCTYPE html>
<html class="vc-site-polish" lang="it">
  <head>
    <script>
      (function () {
        try {
          var q = new URLSearchParams(window.location.search || "");
          var t = String(q.get("target") || q.get("slot") || "primary")
            .trim()
            .toLowerCase();
          if (t === "vocale") t = "voice";
          if (t !== "primary" && t !== "secondary" && t !== "voice") t = "primary";
          var next = new URLSearchParams();
          next.set("target", t);
          var id = String(q.get("id") || q.get("userId") || "").trim();
          if (/^\d{17,20}$/.test(id)) next.set("id", id);
          window.location.replace("/personalizza/?" + next.toString());
        } catch (e) {
          window.location.replace("/personalizza/?target=primary");
        }
      })();
    </script>
    <meta charset="utf-8" />
    <title>{{SITE_NAME}} | Personalizza</title>
    <script src="/js/vc-page-title.js?v=20260825pageTitle1"></script>
    <meta http-equiv="refresh" content="0;url=/personalizza/?target=primary" />
    <link rel="canonical" href="/personalizza/?target=primary" />
<script src="/js/vc-site-toast.js?v=20260825siteToast1"></script>
    </head>
  <body>
    <p><a href="/personalizza/?target=primary">Vai a Personalizza</a></p>
</body>
</html>
