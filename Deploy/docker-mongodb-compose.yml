# Credenziali: MONGO_INITDB_* dal .env del bot (source in start-mongo.sh), non un file separato.
services:
  mongodb:
    image: mongo:7
    container_name: vc-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      # Volume storico del bot (NON deploy_mongodb_data creato per errore dal compose project).
      - vc_mongodb_data:/data/db
    # 640m era troppo stretto: WiredTiger + connessioni bot → OOM thrash / timeout.
    mem_limit: 1024m
    memswap_limit: 1280m
    command:
      - mongod
      - --bind_ip_all
      # 0.3: dal 30/10/2026, con meno processi Node (meno connessioni) e la VPS senza RAM libera
      - --wiredTigerCacheSizeGB
      - "0.3"

volumes:
  vc_mongodb_data:
    external: true
