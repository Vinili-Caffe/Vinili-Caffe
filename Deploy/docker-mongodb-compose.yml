# Credenziali: MONGO_INITDB_* dal .env del bot (source in start-mongo.sh), non un file separato.
services:
  mongodb:
    image: mongo:7
    container_name: vc-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      # Volume storico del bot (NON deploy_mongodb_data creato per errore dal compose project).
      - vc_mongodb_data:/data/db
    # 1G bastava a regime, ma il mongodump delle 00:00 + i bot facevano timeout/riavvio.
    mem_limit: 2048m
    memswap_limit: 2304m
    command:
      - mongod
      - --bind_ip_all
      # Allineato al limit 2G (prima 0.3 con 1G): lascia margine a connessioni e dump.
      - --wiredTigerCacheSizeGB
      - "0.5"

volumes:
  vc_mongodb_data:
    external: true
