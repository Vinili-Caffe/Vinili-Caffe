# Niente env_file: Docker a volte cerca .env.mongo nella directory SBAGLIATA se lanci
# compose da /opt/bot con -f deploy/... → "file not found". User e password arrivano da --env-file.
services:
  mongodb:
    image: mongo:7
    container_name: vc-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      # Volume storico del bot (NON deploy_mongodb_data creato per errore dal compose project).
      - vc_mongodb_data:/data/db
    # 640m era troppo stretto: WiredTiger + connessioni bot → OOM thrash / timeout.
    mem_limit: 1024m
    memswap_limit: 1280m
    command:
      - mongod
      - --bind_ip_all
      - --wiredTigerCacheSizeGB
      - "0.4"

volumes:
  vc_mongodb_data:
    external: true
