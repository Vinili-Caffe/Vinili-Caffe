# cacheDefer3: stamped/hashed long-cache; unstamped short
map $uri $vc_asset_cc {
    default "public, max-age=120, must-revalidate";
    "~*^/(css|js)/.+\.20[0-9][0-9][0-9][0-9][0-9][0-9][A-Za-z0-9]+\.(css|js)$" "public, max-age=31536000, immutable";
    "~*^/css/pages/vc-page-bundle\.[a-f0-9]+\.css$" "public, max-age=31536000, immutable";
}
