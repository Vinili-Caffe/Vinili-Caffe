<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="refresh" content="0;url=/staff/confessionale/" />
    <link rel="canonical" href="{{SITE_URL}}staff/confessionale/" />
    <title>Redirect…</title>
    <script>
      (function () {
        try {
          var q = String(location.search || "");
          var h = String(location.hash || "");
          location.replace("/staff/confessionale/" + q + h);
        } catch (e) {
          location.href = "/staff/confessionale/";
        }
      })();
    </script>
  </head>
  <body>
    <p><a href="/staff/confessionale/">Vai al confessionale staff</a></p>
  </body>
</html>
